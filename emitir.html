<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Carteirinha — ASF</title>
<meta name="description" content="Crie, visualize e baixe sua carteirinha digital ASF. Registro opcional no controle interno da associação.">
<link rel="canonical" href="https://asf.surf/emitir.html">
<style>
:root{--primary:#00a8cc;--primary-dark:#007a99;--secondary:#0e2439;--gray-100:#eef3f6;--gray-200:#ccd6df;--gray-600:#526577;--shadow-lg:0 12px 30px #0e243922}*{box-sizing:border-box}body{margin:0;background:#f3f7fa;color:#0e2439;font:16px system-ui,sans-serif}header,main,footer{max-width:600px;margin:auto;padding:20px}header a,a{color:#007a99}h1{font-size:28px;margin:16px 0 8px}h2{font-size:21px}p{line-height:1.55}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 4px 20px #0e243910}summary{cursor:pointer;font-weight:600}.btn{display:inline-block;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:#007a99;color:white;font:600 14px system-ui}.btn-primary{width:100%}.btn-secondary{background:#e5f0f5;color:#0e2439}.btn:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #b679d0;outline-offset:3px}footer{font-size:12px;color:#526577}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 18px;border-radius:12px;background:#0e2439;color:white;max-width:calc(100% - 32px);width:max-content;z-index:100;display:none;font-size:14px}#toast.show{display:block}@media(max-width:480px){header,main,footer{padding:16px}.card{padding:18px}}
</style>
</head>
<body>
<header><a href="./index.html">← Voltar ao ASF</a><h1>Sua Carteirinha ASF</h1><p>Crie sua carteirinha digital, adicione uma foto e baixe o PNG. Seus dados não aparecem em uma lista pública.</p></header>
<main><div id="carteirinha-content" aria-label="Emissão e visualização da sua carteirinha"></div><noscript><p>Ative o JavaScript no navegador para gerar sua carteirinha.</p></noscript></main>
<footer>O registro ASF é opcional e destinado ao controle interno. Os benefícios com parceiros estão em preparação. <a href="./privacidade.html">Privacidade</a>.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>let toastTimer;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',6500);}</script>
<script src="./carteirinha.js?v=20261007-privacy"></script>
</body></html>
