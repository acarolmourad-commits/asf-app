<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Em manutencao - ASF</title>
  <link rel="stylesheet" href="./asf-mural.css">
</head>
<body style="display:grid;place-items:center;min-height:80vh;text-align:center;font-family:sans-serif">
  <main>
    <h1>Ops, mare mexida!</h1>
    <p id="msg">Este mini-app esta em manutencao. Voltamos ja ja!</p>
    <p><a href="./index.html">Voltar ao App ASF</a></p>

  <script src="./asf-bottomnav.js"></script>

    const app = new URLSearchParams(location.search).get("app");
    if (app) document.getElementById("msg").textContent =

  </script>
</body>
</html>
