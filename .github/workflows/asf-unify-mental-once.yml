name: ASF home mental guide consolidation once
on:
  push:
    branches: [main]
    paths: [.github/workflows/asf-unify-mental-once.yml]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace only duplicated mental guide with linked summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          begin = '<!-- Premium Article 2 -->'
          end = '<!-- Premium Article 3:'
          assert s.count(begin) == 1 and s.count(end) == 1, 'Guide structure changed; stop rather than overwrite'
          a = s.index(begin)
          b = s.index(end, a)
          old = s[a:b]
          assert 'Mental de Competidora: Técnicas de Visualização' in old
          assert 'id="premium-2-full"' in old
          card = '''<!-- Premium Article 2: guia centralizado no ASF Mental -->
          <div class="card" style="margin-bottom:16px;border-left:4px solid #9b59b6;">
            <span style="background:#8e44ad;color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;">📖 GUIA · ASF MENTAL</span>
            <h4 style="font-size:15px;margin-top:8px;">🧠 Mental de Competidora: Técnicas de Visualização</h4>
            <div id="premium-2-full" style="margin-top:12px;">
              <p style="font-size:13px;color:var(--gray-600);line-height:1.8;">Prepare sua mente para a bateria: filme mental, ancoragem positiva, foco no processo e uma rotina pré-competição. O guia completo está no ASF Mental, junto da visualização guiada de 2 minutos.</p>
              <a href="https://mental.asf.surf/#mental-de-competidora" style="display:inline-block;margin-top:12px;padding:10px 16px;border-radius:12px;background:#8e44ad;color:#fff;text-decoration:none;font-weight:600;">Praticar no ASF Mental →</a>
            </div>
          </div>
          
          '''
          new = s[:a] + card + s[b:]
          assert new.count('id="premium-2-full"') == 1
          assert 'reduz a ansiedade em até 40%' not in new
          assert new[:a] == s[:a] and new[a+len(card):] == s[b:]
          p.write_text(new)
          PY
      - name: Commit localized changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: link homepage competitor guide to ASF Mental'
          git pull --rebase origin main
          git push origin HEAD:main
