name: a11y-aria-labels
# Adiciona aria-label em botoes que so tem icone/emoji (leitores de tela).
# Execucao MANUAL. Validacoes: nenhum botao pode ser perdido, HTML precisa parsear.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adiciona aria-labels com validacao
        run: |
          python3 - <<'EOF'
          import re, glob
          from html.parser import HTMLParser
          total = 0
          for f in glob.glob('**/*.html', recursive=True):
              if '.git' in f or f.startswith('docs/'): continue
              s = open(f, encoding='utf8').read()
              before = len(re.findall(r'<button', s))
              def fix(m):
                  global total
                  attrs, label = m.group(1), m.group(2)
                  clean = re.sub(r'<[^>]+>', '', label).strip()
                  # so icone/emoji/curto e sem aria-label
                  if 'aria-label' in attrs or not clean or len(clean) > 6:
                      return m.group(0)
                  if not re.fullmatch(r'[\W\d_]+', clean) and len(clean) > 2:
                      return m.group(0)
                  esc = clean.replace('"', '&quot;')
                  total += 1
                  return f'<button aria-label="{esc}"{attrs}>{label}</button>'
              s = re.sub(r'<button((?:(?!aria-label)[^>])*)>(.*?)</button>', fix, s, flags=re.S)
              after = len(re.findall(r'<button', s))
              assert before == after, f'{f}: botoes mudaram {before} -> {after}'
              class P(HTMLParser): pass
              P().feed(s)
              open(f, 'w', encoding='utf8').write(s)
          print(f'{total} botoes ganharam aria-label')
          EOF
      - name: Commit apenas se houver mudanca
        run: |
          if git diff --quiet; then echo "Nada a commitar"; exit 0; fi
          git config user.name "asf-bot"
          git config user.email "asf-bot@users.noreply.github.com"
          git add -A
          git commit -m "a11y: aria-labels em botoes de icone"
          git push
