name: Add Para Marcas home section v2 2026-11-08 (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-para-marcas-home-v2-20261108.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Para Marcas section
        run: |
          python3 - <<'PY'
          import pathlib, sys, base64
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="para-marcas"' in s:
              print('para-marcas already exists'); sys.exit(1)
          anchor = '<nav id="comecar"'
          i = s.find(anchor)
          if i < 0:
              print('comecar anchor not found'); sys.exit(1)
          if s.find('id="parcerias-destaque"') < 0 or s.find('id="parcerias-destaque"') > i:
              print('parcerias-destaque not before comecar'); sys.exit(1)
          block = base64.b64decode('').decode('utf-8')
          s = s[:i] + block + s[i:]
          if s.count('id="para-marcas"') != 1:
              print('para-marcas count wrong'); sys.exit(1)
          p.write_text(s, encoding='utf-8')
          print('para-marcas inserted v2')
          PY
      - name: Commit and push if changed
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'ASF Bot'
          git config user.email 'bot@asf-app.com'
          git add index.html
          git commit -m 'feat(home): secao Para Marcas com proposta e governanca para parceiros'
          git push
