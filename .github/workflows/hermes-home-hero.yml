name: 🏠 MISSÃO HERMES — Hero da Home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-home-hero.yml'
      - 'scripts/hermes_home_hero.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hero:
    name: Atualizar hero da Home
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🏠 Aplicar melhoria do hero
        run: python3 scripts/hermes_home_hero.py
      - name: 💾 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🏠 Home: proposta de valor clara + CTA para guia editorial (MISSÃO HERMES)"
            git pull --rebase origin main
            git push
          fi
