name: ASF - onda 4 (carteirinha digital v2)
on:
  push:
    paths:
      - scripts/fix_wave4.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_wave4.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html carteirinha.js
          git diff --cached --quiet && echo "no changes" || (git commit -m "feat: carteirinha digital personalizada com QR code (base para parcerias)" && git push)
