name: Perf — Preconnect AdSense

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/perf-adsense-preconnect.yml'

permissions:
  contents: write

jobs:
  preconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adiciona preconnect AdSense
        run: python3 .github/scripts/add_adsense_preconnect.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Nada a commitar" && exit 0
          git commit -m "perf: preconnect + dns-prefetch para pagead2.googlesyndication.com"
          git push
