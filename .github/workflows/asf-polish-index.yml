name: ASF Polish Index (one-shot)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/asf_polish_index.py'

permissions:
  contents: write

jobs:
  polish-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply index.html polish (SEO meta, JSON-LD WebSite, footer institucional)
        run: python3 scripts/asf_polish_index.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "feat: SEO meta tags, JSON-LD WebSite e footer institucional no index.html"
            git push
          fi
