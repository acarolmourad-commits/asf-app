name: fix-index-syntax
on:
  push:
    paths:
      - '.github/workflows/fix-index.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/patch_index.py
      - name: Validate JS blocks
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys
          html=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.S)
          bad=0
          for i,b in enumerate(blocks):
              if '"@context"' in b[:50]: continue
              open('/tmp/blk.js','w').write(b)
              r=subprocess.run(['node','--check','/tmp/blk.js'],capture_output=True,text=True)
              if r.returncode!=0:
                  bad+=1; print('block',i,'INVALID')
          sys.exit(1 if bad else 0)
          EOF
      - name: Commit fix
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(index): close unterminated DOMContentLoaded block - revives chatbot, calendar and all inline JS"
          file_pattern: index.html
