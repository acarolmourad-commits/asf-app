name: Fix i18n Lojas term

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update translation dict
        run: |
          python3 << 'EOF'
          h = open('index.html', encoding='utf-8').read()
          orig = h
          h = h.replace("'Lojas': 'Shops',", "'Marcas Parceiras': 'Partner Brands',")
          h = h.replace("'Lojas': 'Tiendas',", "'Marcas Parceiras': 'Marcas Asociadas',")
          # fix pre-existing typo in ES dict
          h = h.replace("'Manas Próximas': ' sisters Cercanas',", "'Manas Próximas': 'Hermanas Cercanas',")
          assert "'Lojas':" not in h
          assert h != orig
          open('index.html', 'w', encoding='utf-8').write(h)
          print('i18n dict updated')
          EOF
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(i18n): atualiza dicionário EN/ES — Lojas -> Marcas Parceiras; corrige typo 'sisters Cercanas'"
          file_pattern: index.html
