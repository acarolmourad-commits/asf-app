name: ASF Free Content Guard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/test_free_content.py"
  pull_request:
    paths:
      - "index.html"
      - "scripts/test_free_content.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar politica de conteudo 100% gratuito
        run: python3 scripts/test_free_content.py
