name: Fix - Carteirinha RPC unico (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar consolidacao RPC unico
        run: python .github/scripts/fix_carteirinha_rpc_unico.py
      - name: Validar sintaxe JS
        run: node --check carteirinha.js
      - name: Commit das alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria"
          else
            git add carteirinha.js emitir.html docs/carteirinhas-production-runbook.md
            git commit -m "fix(carteirinha): unifica emissao via RPC + runbook Fase A+B"
            git push
          fi
