name: Email Monitor - Leads CRM

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6h (UTC)
  workflow_dispatch:        # permite rodar manualmente

permissions:
  issues: write
  contents: read

jobs:
  check-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install google-api-python-client google-auth

      - name: Check lead replies on Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          LEAD_EMAILS: ${{ vars.LEAD_EMAILS }}
          REPORT_PATH: lead_replies_report.md
        run: python .github/scripts/check_lead_replies.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lead-replies-report
          path: lead_replies_report.md
          retention-days: 30

      - name: Open issue if hot replies found
        if: env.HOT_REPLIES == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('lead_replies_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔥 Respostas quentes de leads — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['crm', 'leads']
            });
