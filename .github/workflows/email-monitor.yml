name: Email Monitor - Villa Blu (Private Notion)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asf-private-partnership-monitor
  cancel-in-progress: false

jobs:
  check-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: pip install requests
      - name: Test privacy, deduplication and seven-day rule with synthetic data
        run: python .github/scripts/check_lead_replies.py --self-test
      - name: Check partnership and write minimal state to private Notion
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GMAIL_ACCOUNT_ID: gmail_ponder-speiss
          NOTION_ACCOUNT_ID: notion_otiant-milieu
          NOTION_MONITOR_PAGE_ID: 3f3abe37-0d44-8158-bd94-f7cdf5e8378c
          NOTION_STATUS_BLOCK_ID: b29ed947-1672-48f9-8132-39b1a0bdb02f
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('private_monitor', '.github/scripts/check_lead_replies.py')
          monitor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(monitor)
          try:
              monitor.run()
          except monitor.MonitorError as exc:
              # These messages are fixed, sanitized stage/status codes only.
              print('::error::' + str(exc))
              sys.exit(1)
          except Exception:
              print('::error::Private monitor unexpected failure; payload suppressed.')
              sys.exit(1)
          PY
      # No public issues, email excerpts, uploaded reports, or automatic sends.
