name: 🌊 Remover seção Previsão de Ondas da home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-wave-forecast.yml'
      - 'scripts/remove_wave_forecast.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-wave-forecast:
    name: Limpeza da home e validação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🌊 Aplicar limpeza
        run: python3 scripts/remove_wave_forecast.py
      - name: ✅ Validações de integridade
        run: |
          ! grep -n 'Previsão de Ondas - Litoral Paulista' index.html && echo "✅ sem seção de previsão de ondas"
          ! grep -n 'Open-Meteo Marine API' index.html && echo "✅ sem fonte Open-Meteo"
          ! grep -n 'id="surfBar"' index.html && echo "✅ sem barra de condições ao vivo"
          ! grep -n 'id="dica-do-dia"' index.html && echo "✅ sem card dinâmico Dica do Dia"
          node --check app.js 2>/dev/null && echo "✅ app.js sintaxe OK" || echo "⚠️ node não disponível, pulando checagem de sintaxe"
          test "$(grep -c '<style' index.html)" = "$(grep -c '</style>' index.html)" && echo "✅ styles balanceados"
      - name: 📮 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html app.js
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🧹 Limpeza da home: remover surf bar e dica dinâmica, guards no app.js"
            git pull --rebase origin main && git push
          fi
