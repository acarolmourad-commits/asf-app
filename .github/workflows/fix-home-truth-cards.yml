name: ASF Fix Home Truth Cards (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remover infos falsas dos cards da home e linkar apps reais
        run: python3 scripts/fix_home_truth_cards.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "fix(home): remove picos secretos falsos e métricas inventadas; linka asf-previsao, asf-mare, asf-praias, asf-mapa, asf-atlas; teasers ASF Swell e ASF Vídeo"
            git push
          fi
