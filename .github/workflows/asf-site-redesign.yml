name: ASF Site Redesign
on:
  push:
    branches: [main]
    paths: [.github/workflows/asf-site-redesign.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared design assets to every public page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          public=[p for p in Path('.').rglob('*.html') if p.parts[0] not in {'docs','meta-integration'}]
          css='    <link rel="stylesheet" href="/asf-app/asf-site-redesign.css">\n'
          js='    <script src="/asf-app/asf-redesign.js" defer></script>\n'
          for p in public:
              if str(p) == 'index.html':
                  continue
              s=p.read_text()
              if '/asf-app/asf-site-redesign.css' not in s and '</head>' in s:
                  s=s.replace('</head>', css+'</head>', 1)
              if '/asf-app/asf-redesign.js' not in s and '</body>' in s:
                  s=s.replace('</body>', js+'</body>', 1)
              p.write_text(s)
          PY
      - name: Commit remaining page updates
        run: |
          git config user.name "ASF Bot"
          git config user.email "acarolmourad-commits@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Apply redesign to subdirectory pages"
          git push
