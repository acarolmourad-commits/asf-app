name: asf-fix-base
on:
  push:
    paths:
      - ".github/workflows/asf-fix-base.yml"
      - "scripts/fix_base.py"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_base.py
      - name: Commit se houve mudanca
        run: |
          git config user.name "asf-bot"
          git config user.email "asf-bot@users.noreply.github.com"
          git add asf-ux.js asf-redesign.js asf-bottomnav.js
          git diff --cached --quiet || git commit -m "fix: ASF_BASE auto-detecta dominio (asf.surf raiz vs github.io/asf-app) - bottom nav e SW"
          git push
