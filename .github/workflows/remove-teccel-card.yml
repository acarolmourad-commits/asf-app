name: Remover card Teccel (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover card Phenix Teccel do index.html
        run: |
          python3 - <<'EOF'
          html = open('index.html', encoding='utf-8').read()
          tpos = html.find('Phenix Teccel')
          if tpos == -1:
              print('Card Teccel nao encontrado; nada a fazer.')
              raise SystemExit(0)
          start = html.rfind('<div class="card">', 0, tpos)
          next_card = html.find('<div class="card">', tpos)
          assert start != -1 and next_card != -1
          html = html[:start] + html[next_card:]
          open('index.html', 'w', encoding='utf-8').write(html)
          print('Card removido com sucesso.')
          EOF

      - name: Commit se houver mudanca
        run: |
          if git diff --quiet index.html; then
            echo "Sem mudancas."
          else
            git config user.name "asf-bot"
            git config user.email "actions@github.com"
            git add index.html
            git commit -m "chore: remove card Phenix Teccel (conteudo movido para aba Eco)"
            git push
          fi
