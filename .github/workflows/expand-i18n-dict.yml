name: Expand i18n dictionary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand walkTree translation dict
        run: |
          python3 << 'PYEOF'
          h = open('index.html', encoding='utf-8').read()
          orig = h

          en_add = """        'Meu Perfil': 'My Profile',
              'Dicas de Surf': 'Surf Tips',
              'T\u00e9cnica de Surf': 'Surf Technique',
              'Mobilidade & Preven\u00e7\u00e3o': 'Mobility & Prevention',
              'Sa\u00fade & Treino Funcional': 'Health & Functional Training',
              'Alimenta\u00e7\u00e3o & Nutri\u00e7\u00e3o': 'Food & Nutrition',
              'Mental & Calmaria': 'Mind & Calm',
              'Guia de Praias': 'Beach Guide',
              'Litoral Paulista': 'S\u00e3o Paulo Coast',
              'Not\u00edcias de Surf': 'Surf News',
              'Hist\u00f3rias do Surf': 'Surf Stories',
              'Competi\u00e7\u00f5es & Eventos': 'Competitions & Events',
              'Desafios & Ranking': 'Challenges & Ranking',
              'Minhas Conquistas': 'My Achievements',
              'Conquistas Secretas': 'Secret Achievements',
              'Metas de Surf': 'Surf Goals',
              'Meu Progresso': 'My Progress',
              'Manas - Grupos de Surf': 'Sisters - Surf Groups',
              'Guias Completos ASF': 'Complete ASF Guides',
              'Destaques ASF': 'ASF Highlights',
              'Brand Hub Feminino': 'Female Brand Hub',
              'Checklist P\u00f3s-Surf': 'Post-Surf Checklist',
              'Loja ASF': 'ASF Shop',
              'Cadastro de Parceiros': 'Partner Sign-up',
              'Quero ser parceiro': 'I want to be a partner',
              'Ver tudo': 'See all',
              'Ver mapa': 'View map',
              'Ver ranking': 'View ranking',
              'Dica do Dia': 'Tip of the Day',
              'Buscar dicas, lojas, treinos': 'Search tips, shops, training'
          }"""

          es_add = """        'Meu Perfil': 'Mi Perfil',
              'Dicas de Surf': 'Consejos de Surf',
              'T\u00e9cnica de Surf': 'T\u00e9cnica de Surf',
              'Mobilidade & Preven\u00e7\u00e3o': 'Movilidad & Prevenci\u00f3n',
              'Sa\u00fade & Treino Funcional': 'Salud & Entrenamiento Funcional',
              'Alimenta\u00e7\u00e3o & Nutri\u00e7\u00e3o': 'Alimentaci\u00f3n & Nutrici\u00f3n',
              'Mental & Calmaria': 'Mente & Calma',
              'Guia de Praias': 'Gu\u00eda de Playas',
              'Litoral Paulista': 'Costa Paulista',
              'Not\u00edcias de Surf': 'Noticias de Surf',
              'Hist\u00f3rias do Surf': 'Historias del Surf',
              'Competi\u00e7\u00f5es & Eventos': 'Competiciones & Eventos',
              'Desafios & Ranking': 'Desaf\u00edos & Ranking',
              'Minhas Conquistas': 'Mis Logros',
              'Conquistas Secretas': 'Logros Secretos',
              'Metas de Surf': 'Metas de Surf',
              'Meu Progresso': 'Mi Progreso',
              'Manas - Grupos de Surf': 'Hermanas - Grupos de Surf',
              'Guias Completos ASF': 'Gu\u00edas Completas ASF',
              'Destaques ASF': 'Destacados ASF',
              'Brand Hub Feminino': 'Hub de Marcas Femeninas',
              'Checklist P\u00f3s-Surf': 'Lista Post-Surf',
              'Loja ASF': 'Tienda ASF',
              'Cadastro de Parceiros': 'Registro de Socios',
              'Quero ser parceiro': 'Quiero ser socio',
              'Ver tudo': 'Ver todo',
              'Ver mapa': 'Ver mapa',
              'Ver ranking': 'Ver ranking',
              'Dica do Dia': 'Consejo del D\u00eda',
              'Buscar dicas, lojas, treinos': 'Buscar consejos, tiendas, entrenamientos'
          }"""

          en_anchor = "'Calculadora de Prancha': 'Board Calculator'\n    },"
          es_anchor = "'Calculadora de Prancha': 'Calculadora de Tabla'\n    }"
          assert en_anchor in h, 'anchor EN nao encontrada'
          assert es_anchor in h, 'anchor ES nao encontrada'
          h = h.replace(en_anchor, "'Calculadora de Prancha': 'Board Calculator',\n" + en_add.replace('\n          }', ''), 1)
          h = h.replace(es_anchor, "'Calculadora de Prancha': 'Calculadora de Tabla',\n" + es_add.replace('\n          }', ''), 1)
          assert h != orig
          open('index.html', 'w', encoding='utf-8').write(h)
          print('dict expandido OK')
          PYEOF
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(i18n): expande dicion\u00e1rio walkTree EN/ES com t\u00edtulos de se\u00e7\u00f5es e labels principais"
          file_pattern: index.html
