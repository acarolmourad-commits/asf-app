name: P3 — Remove Infolinks (monetização consolidada no AdSense)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p3-remove-infolinks.yml'

permissions:
  contents: write

jobs:
  remove-infolinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Infolinks do index.html
        run: |
          python3 .github/scripts/p3_remove_infolinks.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Nada a commitar" && exit 0
          git commit -m "perf: P3 — remove Infolinks (preconnect, config e script); mantém apenas Google AdSense"
          git push
