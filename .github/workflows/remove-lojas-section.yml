name: Remove Lojas Section

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit index.html
        run: |
          python3 << 'EOF'
          html = open('index.html', encoding='utf-8').read()
          start_marker = '<div class="section" id="lojas">'
          cta_marker = 'Sua loja n'
          i = html.index(start_marker)
          j = html.index(cta_marker, i)
          cta_start = html.rfind('<div style="text-align: center', i, j)
          assert cta_start != -1
          after_cta = html.index('</div>', html.index('Quero ser parceiro', j))
          section_end = html.index('</div>', after_cta + 6)
          new_section = '''<div class="section" id="lojas">
                      <div class="section-header">
                          <h2 class="section-title">\U0001F91D Marcas Parceiras</h2>
                      </div>

                      <!-- Placeholder: futuras marcas parceiras ASF. Adicionar cards aqui quando parcerias forem firmadas. -->
                      <div id="parceiros-list" class="cards-grid" style="display:none;"></div>

                      ''' + html[cta_start:section_end] + '</div>'
          new_html = html[:i] + new_section + html[section_end + len('</div>'):]
          assert new_html.count('<div') == new_html.count('</div>')
          assert 'sthillsurf' not in new_html
          open('index.html', 'w', encoding='utf-8').write(new_html)
          print('OK', len(html), '->', len(new_html))
          EOF
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: remove listagem de lojas da home; mantém CTA de parceria e prepara seção para futuras marcas parceiras"
          file_pattern: index.html
