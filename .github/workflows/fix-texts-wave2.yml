name: ASF - corrige acentuacao dos textos visiveis (onda 2)
on:
  push:
    paths:
      - scripts/fix_texts_wave2.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_texts_wave2.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: acentuacao dos textos visiveis - dicas, praias, ManaBot e guias (onda 2)" && git push)
