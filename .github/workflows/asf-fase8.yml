name: asf-fase8-one-shot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restaura guia-apps.html
        run: python scripts/asf_restore_guia.py | tee restore.log
      - name: Commit e push
        run: |
          if grep -q NOTHING_TO_DO restore.log; then echo 'Nada a fazer'; exit 0; fi
          git config user.name 'asf-bot'
          git config user.email 'asf.surffeminino@gmail.com'
          git add guia-apps.html
          git commit -m 'fix: restaura guia-apps.html completo (53 apps) + chips de categoria'
          git push
