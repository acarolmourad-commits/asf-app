name: asf-fase8-one-shot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplica FASE 8
        run: python scripts/asf_fase8.py | tee fase8.log
      - name: Commit e push
        run: |
          if grep -q NOTHING_TO_DO fase8.log; then echo 'Nada a fazer'; exit 0; fi
          git config user.name 'asf-bot'
          git config user.email 'asf.surffeminino@gmail.com'
          git add asf-ux.js asf-redesign.js asf-bottomnav.js guia-apps.html
          git commit -m 'feat: FASE 8 - integra Mural das Manas, bottom nav, SW offline e chips no guia (aditivo)'
          git push
