name: ASF Cleanup Fake Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/asf_cleanup_fakes.py']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cleanup
        run: python scripts/asf_cleanup_fakes.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ASF cleanup: remove metricas, parceiros e premios ficticios"
          git push
