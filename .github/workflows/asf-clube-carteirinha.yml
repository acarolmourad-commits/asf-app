name: ASF Clube Carteirinha (one-shot)

on:
  push:
    branches: [fix/clube-carteirinha-20261016]
    paths:
      - ".github/workflows/asf-clube-carteirinha.yml"
      - "scripts/apply_clube_carteirinha.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply Clube to Carteirinha edits
        run: python3 scripts/apply_clube_carteirinha.py
      - name: Regenerate registry consumers
        run: python3 scripts/sync_apps_registry.py --write
      - name: Validate registry consumers
        run: python3 scripts/sync_apps_registry.py
      - name: Commit validated consolidation and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q scripts/apply_clube_carteirinha.py .github/workflows/asf-clube-carteirinha.yml
          git add data/apps.json data/app-links.json asf-network.js guia-apps.html apps/index.html novidades.html scripts/sync_apps_registry.py
          git diff --cached --quiet && echo "No changes to commit" && exit 1
          git commit -m "fix(registry): consolidate Clube into Carteirinha"
          git push
