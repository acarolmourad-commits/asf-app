name: fix-logo-svg
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix SVG logo closing tag
        run: |
          sed -i 's|</lineargradient>|</linearGradient>|g' index.html
          grep -c 'linearGradient' index.html
      - name: Fix og:image absolute URL
        run: |
          sed -i 's|<meta property="og:image" content="assets/images/hero-surf.jpg">|<meta property="og:image" content="https://acarolmourad-commits.github.io/asf-app/assets/images/hero-surf.jpg">|' index.html
      - name: Commit
        run: |
          git config user.name "asf-bot"
          git config user.email "asf.surffeminino@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: SVG logo closing tag (</linearGradient>) + absolute og:image"
          git push
