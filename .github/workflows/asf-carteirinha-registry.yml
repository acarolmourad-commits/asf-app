name: ASF Carteirinha Registry
on:
  workflow_dispatch:
    inputs:
      registry_url:
        description: Deployment URL do Apps Script (opcional; ativa o registro em producao)
        required: false
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/asf-carteirinha-registry.yml]
permissions:
  contents: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and optionally activate opt-in registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          js = Path('carteirinha.js')
          gs = Path('docs/ASF_Carteirinhas_Registry.gs')
          panel = Path('carteirinhas.html')
          for p in (js, gs, panel):
              if not p.exists():
                  raise SystemExit(f'Missing required file: {p}')
          text = js.read_text(encoding='utf-8')
          required = ['REGISTRY_URL', 'registrar(d)', 'card-registrar', 'sendBeacon', 'registrada']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('carteirinha.js integration incomplete: ' + ', '.join(missing))
          registry_url = '''${{ github.event.inputs.registry_url }}'''.strip()
          if registry_url:
              if not (registry_url.startswith('https://script.google.com/') and registry_url.endswith('/exec')):
                  raise SystemExit('registry_url must be an Apps Script /exec URL')
              text, count = re.subn(r"REGISTRY_URL:\s*'[^']*'", "REGISTRY_URL: '" + registry_url + "'", text, count=1)
              if count != 1:
                  raise SystemExit('Could not update REGISTRY_URL')
              js.write_text(text, encoding='utf-8')
              print('REGISTRY_URL configured')
          else:
              print('Registry integration validated; production URL not provided')
          if "TROQUE-POR-UM-SEGREDO" in gs.read_text(encoding='utf-8'):
              print('::notice::Apps Script TOKEN still uses the documented placeholder; configure it during Google deployment.')
          PY
      - name: Commit registry URL when provided
        if: ${{ github.event.inputs.registry_url != '' }}
        run: |
          git config user.name "ASF Bot"
          git config user.email "acarolmourad-commits@users.noreply.github.com"
          git add carteirinha.js
          git diff --cached --quiet || git commit -m "Activate carteirinha registry endpoint"
          git push
