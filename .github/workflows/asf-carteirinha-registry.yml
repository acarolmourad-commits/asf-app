name: ASF Carteirinha Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/asf-carteirinha-registry.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add opt-in registry to carteirinha.js
        run: |
          echo "" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carteirinha.js
          git diff --cached --quiet || git commit -m "ASF: registro opt-in de carteirinhas (controle de associadas)"
          git push
