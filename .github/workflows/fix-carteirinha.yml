name: Fix - Carteirinha sendBeacon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply sendBeacon patch
        run: python .github/scripts/fix_carteirinha_beacon.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria"
          else
            git add carteirinha.js
            git commit -m "fix: registrar() usa navigator.sendBeacon com fallback fetch via sbRpc"
            git push
          fi
