name: ASF Add Swell Satellite (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Registrar asf-swell no apps.json e guia-apps.html
        run: python3 scripts/add_asf_swell.py
      - name: Regenerar consumidores do registry (tolera drift editorial pre-existente)
        run: python3 scripts/sync_apps_registry.py --write || true
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add data/apps.json asf-network.js satellites.html apps/index.html guia-apps.html scripts/add_asf_swell.py
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "feat: asf-swell registrado como 53º satélite (direção de swell por spot)"
            git push
          fi
