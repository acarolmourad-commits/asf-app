name: 🧹 Remover conteúdos duplicados dos apps da home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-home-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe-home:
    name: Substituir seções duplicadas por links para os apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 📥 Baixar novo index.html
        run: curl -fL 'https://backend.composio.dev/api/v3/sl/pHe5PAzXs6' -o index.html
      - name: ✅ Validações de integridade
        run: |
          test $(wc -c < index.html) -gt 800000 && echo "✅ tamanho OK"
          grep -q 'href="quiz/"' index.html && echo "✅ link quiz"
          grep -q 'href="diario/"' index.html && echo "✅ link diario"
          grep -q 'href="mareas/"' index.html && echo "✅ link mareas"
          grep -q 'href="previsao-surf/"' index.html && echo "✅ link previsao"
          grep -q 'href="prancha-ideal/"' index.html && echo "✅ link prancha"
          ! grep -q 'Diário de Sessões' index.html && echo "✅ sem diário embutido"
          ! grep -q 'Tábua de Marés' index.html && echo "✅ sem tábua de marés embutida"
          test "$(grep -c '<style' index.html)" = "$(grep -c '</style>' index.html)" && echo "✅ styles balanceados"
          test "$(grep -c '<script' index.html)" = "$(grep -c '</script>' index.html)" && echo "✅ scripts balanceados"
      - name: 📮 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🧹 Home: remover conteúdos duplicados dos apps (quiz, diário, marés, previsão, prancha) e linkar para /apps"
            git pull --rebase origin main && git push
          fi
