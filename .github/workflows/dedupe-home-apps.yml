name: "Home - guards JS pos-deduplicacao"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dedupe-home-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe-home:
    name: Atualizar index.html com guards JS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Baixar novo index.html
        run: curl -fL 'https://backend.composio.dev/api/v3/sl/sWrWE5fY38' -o index.html
      - name: Validacoes de integridade
        run: |
          test $(wc -c < index.html) -gt 800000 && echo "tamanho OK"
          head -c 15 index.html | grep -q '<!DOCTYPE html>' && echo "HTML valido"
          grep -q 'if (!quizDiv || !button) return;' index.html && echo "guard quiz OK"
          grep -q 'if (!marDiv) return;' index.html && echo "guard mar OK"
          grep -q 'if (!list || !count || !stats) return;' index.html && echo "guard sessoes OK"
          grep -q 'href="quiz/"' index.html && echo "link quiz OK"
          grep -q 'href="diario/"' index.html && echo "link diario OK"
      - name: Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🛡️ Home: guards de null em funções JS após remoção de seções duplicadas"
            git pull --rebase origin main && git push
          fi
