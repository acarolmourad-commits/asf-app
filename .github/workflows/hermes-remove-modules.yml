name: 🧹 HERMES - Remoção definitiva de módulos imobiliários

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-remove-modules.yml'
      - 'scripts/remove_real_estate_modules.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  remove-modules:
    name: Remover módulos e validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🧹 Executar remoção
        run: python3 scripts/remove_real_estate_modules.py
      - name: ✅ Validação global
        run: |
          ! grep -iE "Porto Norte|Coastal Realty|Litoral Imóveis|Simulador de Financiamento|Comparador de Cidades|Checklist de Visita a Imóvel|Calendário Sazonal do Mercado|Guia de Bairros por Cidade|99999-9999|98888-8888|97777-7777" index.html && echo "✅ index.html limpo"
      - name: 💾 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          if git diff --quiet; then
            echo "📭 Já removido — sem alterações"
          else
            git add index.html
            git commit -m "🧹 HERMES: remove módulos imobiliários (simulador financiamento, comparador cidades, checklist visita, guia bairros, calendário sazonal, imobiliárias/corretores)"
            git push
            echo "✅ Remoção publicada"
          fi
      - name: 🚀 Disparar deploy (GitHub Pages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml && echo "✅ Deploy disparado"
