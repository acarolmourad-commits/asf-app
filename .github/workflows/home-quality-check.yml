name: ASF home quality regression checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'js/home-main.js'
      - 'assets/js/inline/asf-inline-06.js'
      - 'asf-home-quality.css'
      - 'asf-home-quality.js'
      - 'carteirinha.js'
      - 'tests/home-quality-layer.test.cjs'
      - 'tests/home-guides-partners.test.cjs'
      - '.github/workflows/home-quality-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate homepage JavaScript syntax
        run: |
          node --check app.js
          node --check js/home-main.js
          node --check assets/js/inline/asf-inline-06.js
          node --check asf-home-quality.js
      - name: Run homepage regression tests
        run: node --test tests/home-quality-layer.test.cjs tests/home-guides-partners.test.cjs
