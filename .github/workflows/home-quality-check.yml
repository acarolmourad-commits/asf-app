name: ASF home quality regression checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'js/home-main.js'
      - 'assets/js/inline/asf-inline-06.js'
      - 'asf-home-quality.css'
      - 'asf-home-quality.js'
      - 'asf-ux.js'
      - 'asf-navigation-a11y.js'
      - 'asf-navigation-a11y.css'
      - 'asf-bottomnav.js'
      - 'asf-mural.css'
      - 'carteirinha.js'
      - 'tests/home-quality-layer.test.cjs'
      - 'tests/home-guides-partners.test.cjs'
      - 'tests/navigation-dom.test.cjs'
      - 'tests/navigation-browser.cjs'
      - '.github/workflows/home-quality-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate homepage JavaScript syntax
        run: |
          node --check app.js
          node --check js/home-main.js
          node --check assets/js/inline/asf-inline-06.js
          node --check asf-home-quality.js
      - name: Run homepage regression tests
        run: node --test tests/home-quality-layer.test.cjs tests/home-guides-partners.test.cjs

  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/asf-navigation" --no-save jsdom@26.1.0 playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/asf-navigation/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/asf-navigation/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test DOM and observer regressions
        run: node --test tests/navigation-dom.test.cjs
      - name: Test actual click, touch, focus and responsive rendering
        run: node tests/navigation-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asf-navigation-browser
          path: test-results/navigation/
          retention-days: 7
