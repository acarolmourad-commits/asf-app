name: ASF Dedupe & Interlinks Home (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deduplicar dicas, corrigir quiz/conquistas e adicionar interlinks na home
        run: python3 scripts/asf_dedupe_home.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "refactor(home): dedupe 3116 dicas inline (3481->365), remove codigo morto, corrige card Quiz do Surf + badge Estudiosa, nota de conquistas bloqueadas e 11 interlinks para apps satelites"
            git push
          fi
