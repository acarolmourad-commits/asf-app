name: 🔗 MISSÃO HERMES — Fix âncoras artigos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-fix-anchors.yml'
      - 'scripts/hermes_fix_anchors.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchors:
    name: Corrigir âncoras dos artigos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🔗 Corrigir âncoras
        run: python3 scripts/hermes_fix_anchors.py
      - name: ✅ Validação
        run: |
          ! grep -rn 'index.html#quizzes\|index.html#bem-estar' aprender praias bem-estar && echo "✅ âncoras corrigidas"
      - name: 💾 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add aprender praias bem-estar
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🔗 fix: âncoras #quizzes/#bem-estar → #quiz/#mobilidade nos artigos"
            git push
          fi
