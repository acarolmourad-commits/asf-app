name: ASF Fix Fake Content (one-shot)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_fake_content.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remover conteudo falso/enganoso
        run: python3 scripts/fix_fake_content.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html app.js
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "fix(content): remover premio falso R\$500, stat '500+ socias' e marcar perfis ficticios como demonstracao"
            git push
          fi
