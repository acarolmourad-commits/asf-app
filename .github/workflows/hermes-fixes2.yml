name: 🧹 MISSÃO HERMES — Correções de conteúdo vencido

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-fixes2.yml'
      - 'scripts/hermes_fixes2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fixes:
    name: Aplicar correções de conteúdo vencido
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🧹 Aplicar correções
        run: python3 scripts/hermes_fixes2.py
      - name: ✅ Validação
        run: |
          ! grep -in 'sorteio' index.html && echo "sem sorteio ok"
          ! grep -n 'Circuito Paulista Feminino' index.html && echo "evento vencido removido ok"
      - name: 💾 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html aprender/index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🧹 Conteúdo vencido removido + hub editorial /aprender + botão Ver guias (MISSÃO HERMES)"
            git push
          fi
