name: ASF - onda 7 (inclui app.js)
on:
  push:
    paths:
      - scripts/fix_wave7.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_wave7.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: inclui app.js - restaura showSection e navegacao entre abas" && git push)
