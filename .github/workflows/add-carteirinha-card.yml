name: Add carteirinha home card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add carteirinha home card
        run: |
          python3 << 'PYEOF'
          h = open('index.html', encoding='utf-8').read()
          orig = h

          if 'id="carteirinha-home-card"' in h:
            print('card ja existe'); raise SystemExit(0)

          card = """    <a href=\"#carteirinha\" id=\"carteirinha-home-card\" onclick=\"showSection('carteirinha');if(typeof ASF_CARD!=='undefined')ASF_CARD.init();return false\" style=\"display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:18px;margin:12px 20px;text-decoration:none;color:#0E2439;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid rgba(0,168,204,0.15)\"><span style=\"font-size:2rem\">\U0001FAAA</span><span><b style=\"display:block\">Carteirinha ASF</b><small style=\"color:#666\">Sua identidade de surfista: gratuita, digital e personalizada</small></span></a>
          """

          anchor = '<a href="previsao-surf/"'
          i = h.find(anchor)
          assert i != -1, 'anchor previsao-surf nao encontrada'
          # insere o card logo apos o fechamento do card de previsao (</a> ao final da linha do anchor)
          line_end = h.index('\n', i)
          h = h[:line_end+1] + card + h[line_end+1:]
          assert h != orig
          open('index.html', 'w', encoding='utf-8').write(h)
          print('card adicionado OK')
          PYEOF
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: card da Carteirinha ASF na home (atalho para a aba \U0001FAAA)"
          file_pattern: index.html
