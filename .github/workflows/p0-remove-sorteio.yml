name: 🚨 P0 — Remover sorteio mensal inexistente

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-remove-sorteio.yml'
      - 'scripts/p0_remove_sorteio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  p0-remove-sorteio:
    name: Remover promessa de sorteio e validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🚨 Aplicar correção P0
        run: python3 scripts/p0_remove_sorteio.py
      - name: ✅ Validações de integridade
        run: |
          ! grep -in 'sorteio' index.html && echo "✅ index.html sem sorteio"
          test "$(grep -c '<style' index.html)" = "$(grep -c '</style>' index.html)" && echo "✅ styles balanceados"
          test "$(grep -c '<script' index.html)" = "$(grep -c '</script>' index.html)" && echo "✅ scripts balanceados"
      - name: 💾 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🚨 P0: remover promessa inexistente de sorteio mensal de prancha"
            git push
          fi
