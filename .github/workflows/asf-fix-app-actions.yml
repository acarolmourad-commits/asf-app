name: ASF fix app actions
on:
  push:
    branches: [fix/app-links-acoes]
    paths:
      - scripts/asf_fix_app_actions.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/asf_fix_app_actions.py
      - name: Commit se necessário
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html scripts/asf_fix_app_actions.py .github/workflows/asf-fix-app-actions.yml
          git diff --cached --quiet || git commit -m "fix: converte acoes demonstrativas em links reais"
          git push
