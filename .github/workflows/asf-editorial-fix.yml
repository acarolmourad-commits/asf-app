name: ASF Editorial Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/asf_editorial_fix.py']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/asf_editorial_fix.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ASF editorial: remove numero nao verificavel do card WSL"
          git push