name: ASF - Atualiza card WSL
on:
  push:
    paths:
      - .github/workflows/wsl-card-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e aplicar patch
        run: |
          curl -sL "https://backend.composio.dev/api/v3/sl/QFhDoEtp7N" -o /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Card WSL: dados reais São Sebastião Pro (Challenger Series 26 Set - 03 Out)"
          git push
