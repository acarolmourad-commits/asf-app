name: ASF - fix action buttons & section content
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html and events.json
        run: |
          python3 << 'PYEOF'
          import json

          src = open('index.html', encoding='utf-8').read()
          orig = src

          # 1) Utility buttons: point to correct sections / scroll to cards
          old = '''        <button class="utility-btn" onclick="showSection('dicas')">
                    <span class="icon">🌊</span>
                    <span class="label">Ondas</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities')">
                    <span class="icon">🌡️</span>
                    <span class="label">Clima</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities')">
                    <span class="icon">🗓️</span>
                    <span class="label">Marés</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities')">
                    <span class="icon">🧮</span>
                    <span class="label">Calculadora</span>
                </button>'''
          new = '''        <button class="utility-btn" onclick="showSection('surf-conditions')">
                    <span class="icon">🌊</span>
                    <span class="label">Ondas</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities');setTimeout(function(){var el=document.getElementById('card-clima');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80)">
                    <span class="icon">🌡️</span>
                    <span class="label">Clima</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities');setTimeout(function(){var el=document.getElementById('card-mare');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80)">
                    <span class="icon">🗓️</span>
                    <span class="label">Marés</span>
                </button>
                <button class="utility-btn" onclick="showSection('utilities');setTimeout(function(){var el=document.getElementById('card-calc');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80)">
                    <span class="icon">🧮</span>
                    <span class="label">Calculadora</span>
                </button>'''
          assert old in src, 'buttons block not found'
          src = src.replace(old, new)

          # 2) Add ids to Marés and Calculadora cards
          old2 = '''                <!-- Marés -->
                        <div class="card utility-card">'''
          new2 = '''                <!-- Marés -->
                        <div class="card utility-card" id="card-mare">'''
          assert old2 in src, 'mare card not found'
          src = src.replace(old2, new2)

          old3 = '''                <!-- Calculadora de Prancha --> -->
                        <div class="card utility-card">'''
          new3 = '''                <!-- Calculadora de Prancha -->
                        <div class="card utility-card" id="card-calc">'''
          assert old3 in src, 'calc card not found'
          src = src.replace(old3, new3)

          # 3) Fill surf-conditions section with real content
          old4 = '''    <div class="section" id="surf-conditions"><p style="text-align:center;padding:32px;font-size:14px;color:var(--gray-400)">🌊 Verifique as condições antes de surfar: altura das ondas, período, direção do vento e maré.</p>
              <div class="section-header"><h2 class="section-title">🌊 Condições das Ondas</h2></div>
              <div id="surf-conditions-container-2" style="padding:0 16px;"></div>
            </div>'''
          new4 = '''    <div class="section" id="surf-conditions">
              <div class="section-header"><h2 class="section-title">🌊 Condições das Ondas</h2></div>
              <p style="padding:0 16px;font-size:13px;color:var(--gray-600);margin-bottom:12px;">Verifique as condições antes de surfar: altura das ondas, período, direção do vento e maré. Dados ao vivo via Open-Meteo.</p>
              <div id="surf-conditions-container-2" style="padding:0 16px;">
                <p style="text-align:center;padding:16px;font-size:13px;color:var(--gray-400)">Carregando condições ao vivo…</p>
              </div>
              <div style="padding:0 16px 16px;">
                <div class="card" style="margin-top:8px;">
                  <h4 style="margin-bottom:8px;">📖 Como ler as condições</h4>
                  <ul style="font-size:13px;color:var(--gray-600);padding-left:18px;line-height:1.7;">
                    <li><strong>Altura das ondas:</strong> 0,3–0,6m ideal para iniciantes; 1m+ pede experiência.</li>
                    <li><strong>Período:</strong> acima de 10s = ondas mais organizadas e potentes (groundswell).</li>
                    <li><strong>Vento:</strong> terral/offshore (vindo da terra) deixa o mar limpo; maral/onshore bagunça.</li>
                    <li><strong>Maré:</strong> cada pico tem sua maré ideal — beach breaks costumam gostar de maré média.</li>
                    <li><strong>Segurança:</strong> cheque correntes de retorno, bandeiras dos guarda-vidas e nunca surfe sozinha.</li>
                  </ul>
                </div>
                <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="showSection('utilities')">🌡️ Ver clima, marés e UV detalhados →</button>
              </div>
            </div>'''
          assert old4 in src, 'surf-conditions block not found'
          src = src.replace(old4, new4)

          # 4) Define renderSurfConditions and load both containers
          js = '''
          async function renderSurfConditions(containerId){
            const el=document.getElementById(containerId);
            if(!el) return;
            el.dataset.loaded='1';
            const keys=Object.keys(beaches);
            el.innerHTML='<div class="cards-grid">'+keys.map(k=>'<div class="card utility-card" id="sc-card-'+k+'"><div class="icon">🏖️</div><h4>'+beaches[k].name+'</h4><p style="font-size:13px;color:var(--gray-400)">Carregando…</p></div>').join('')+'</div>';
            for(const k of keys){
              const card=document.getElementById('sc-card-'+k);
              try{
                const m=await fetchMarine(k);
                if(m&&m.current){
                  const c=m.current;
                  const r=surfRating(c.wave_height);
                  card.innerHTML='<div class="icon">🌊</div><h4>'+beaches[k].name+'</h4>'
                    +'<p style="font-size:22px;font-weight:700;color:var(--primary);margin:4px 0;">'+c.wave_height.toFixed(1)+'m</p>'
                    +'<p style="font-size:13px;color:'+r.color+';font-weight:600;">'+r.text+'</p>'
                    +'<div style="font-size:12px;color:var(--gray-600);margin-top:6px;">Período: '+c.wave_period.toFixed(0)+'s | Direção: '+windDir(c.wave_direction)+'</div>'
                    +(c.swell_wave_height?'<div style="font-size:12px;color:var(--gray-600);">Swell: '+c.swell_wave_height.toFixed(1)+'m</div>':'')
                    +'<button class="btn btn-secondary" style="width:100%;margin-top:10px;font-size:12px;" onclick="showSection(\'utilities\')">Detalhes →</button>';
                } else {
                  card.innerHTML='<div class="icon">🏖️</div><h4>'+beaches[k].name+'</h4><p style="font-size:13px;color:var(--gray-400)">Dados indisponíveis no momento</p>';
                }
              }catch(e){
                card.innerHTML='<div class="icon">🏖️</div><h4>'+beaches[k].name+'</h4><p style="font-size:13px;color:var(--gray-400)">Erro ao carregar</p>';
              }
            }
          }
          function asfInitFeatures(){'''
          old5 = 'function asfInitFeatures(){'
          assert src.count(old5) == 1, 'asfInitFeatures not unique'
          src = src.replace(old5, js, 1)

          old6 = "    const sc=document.getElementById('surf-conditions-container');if(sc&&!sc.dataset.loaded){sc.dataset.loaded='1';if(typeof renderSurfConditions!=='undefined')renderSurfConditions('surf-conditions-container')}"
          assert old6 in src, 'sc loader not found'
          new6 = old6 + "\n    const sc2=document.getElementById('surf-conditions-container-2');if(sc2&&!sc2.dataset.loaded){sc2.dataset.loaded='1';if(typeof renderSurfConditions!=='undefined')renderSurfConditions('surf-conditions-container-2')}"
          src = src.replace(old6, new6)

          open('index.html', 'w', encoding='utf-8').write(src)
          print('index.html patched:', len(orig), '->', len(src))

          # 5) events.json: add upcoming events (idempotent)
          ev = json.load(open('data/events.json', encoding='utf-8'))
          titles = [e['titulo'] for e in ev['eventos']]
          add = [
            {"titulo":"🏄 ASF Surf Day Feminino","local":"Bertioga - Praia de Indaiá","inicio":"2026-10-04","fim":"2026-10-04","descricao":"Encontro gratuito da comunidade ASF: aula para iniciantes, free surf e roda de conversa.","fonte":"ASF","status":"FUTURO"},
            {"titulo":"🏆 Copa Litoral Paulista - Etapa 4","local":"Guarujá - Praia da Enseada","inicio":"2026-11-07","fim":"2026-11-08","descricao":"Circuito estadual feminino - penúltima etapa do ranking","fonte":"spsurf.com.br","status":"FUTURO"}
          ]
          for e in reversed(add):
            if e['titulo'] not in titles:
              ev['eventos'].insert(0, e)
          ev['updated'] = '2026-09-16'
          ev['ultima_atualizacao'] = '2026-09-16T15:15:00Z'
          json.dump(ev, open('data/events.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('events.json updated')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/events.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: botoes de acao levam a secoes com conteudo (Ondas, Clima, Mares, Calculadora, Competicoes)" && git push)
