name: ASF - fix action buttons & section content
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/asf_fix_buttons.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/events.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: botoes de acao levam a secoes com conteudo (Ondas, Clima, Mares, Calculadora, Competicoes)" && git push)
