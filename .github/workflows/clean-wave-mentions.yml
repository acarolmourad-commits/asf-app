name: 🧹 Limpar referências à previsão de ondas na home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-wave-mentions.yml'
      - 'scripts/remove_wave_mentions.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-wave-mentions:
    name: Limpar referências restantes e validar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 🧹 Limpar referências
        run: python3 scripts/remove_wave_mentions.py
      - name: ✅ Validações de integridade
        run: |
          ! grep -n 'wave-forecast' index.html && echo "✅ sem referência a wave-forecast"
          ! grep -n "'Previsão de Ondas':" index.html && echo "✅ sem entradas i18n órfãs"
          test "$(grep -c '<style' index.html)" = "$(grep -c '</style>' index.html)" && echo "✅ styles balanceados"
      - name: 📮 Commit e push
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "🧹 Remover referências restantes à previsão de ondas da home"
            git push
          fi
