name: ASF Apps Destaque Homepage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/asf-apps-destaque.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add apps-em-destaque card to homepage
        run: |
          echo "" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ASF: card Apps em Destaque na homepage"
          git push
