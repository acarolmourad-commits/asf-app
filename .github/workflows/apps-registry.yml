name: ASF four-JS transport (isolated manual run)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asf-four-js-transport-20261013
  cancel-in-progress: false
jobs:
  transport:
    if: github.ref == 'refs/heads/transport/asf-js-final-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate package and push only four JS to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,io,json,os,pathlib,subprocess,tempfile,urllib.request,zipfile
          BASE="07e3bf7103b173211ef3897b1e2374cd8914bc55"
          TARGET="fix/asf-js-final-review-20261013"
          URL="https://backend.composio.dev/api/v3/sl/T2sZgY_h7B"
          EXPECTED="7ee2ab5d670f320bd9fe070476ed338449d8b997d54916696afa4b05ac76581c"
          PATHS={"app.js","js/home-main.js","js/home-conquistas.js","surf-news.js"}
          REPO="https://github.com/acarolmourad-commits/asf-app.git"
          def run(args,cwd=None):
           r=subprocess.run(args,cwd=cwd,capture_output=True,text=True,timeout=75)
           if r.returncode:raise RuntimeError("Command failed; no credentials or response contents logged")
           return r.stdout.strip()
          if os.environ.get("GITHUB_REF")!="refs/heads/transport/asf-js-final-20261013":raise RuntimeError("Wrong source branch")
          raw=urllib.request.urlopen(URL,timeout=45).read(200000)
          if hashlib.sha256(raw).hexdigest()!=EXPECTED:raise RuntimeError("Artifact hash mismatch")
          z=zipfile.ZipFile(io.BytesIO(raw));cfg=json.loads(z.read("delivery.json"))
          if cfg["base"]!=BASE or cfg["branch"]!=TARGET or set(cfg["files"])!=PATHS:raise RuntimeError("Invalid manifest")
          work=pathlib.Path(tempfile.mkdtemp())/"repo"
          run(["git","-c","core.hooksPath=/dev/null","clone","--depth","1","--branch","main","--single-branch",REPO,str(work)])
          if run(["git","rev-parse","HEAD"],work)!=BASE:raise RuntimeError("Main advanced; revalidation required")
          if run(["git","ls-remote","--heads","origin",TARGET],work):raise RuntimeError("Target branch exists; do not overwrite")
          for name in sorted(PATHS):
           spec=cfg["files"][name]
           if hashlib.sha256((work/name).read_bytes()).hexdigest()!=spec["before_sha256"]:raise RuntimeError("Base file hash mismatch")
           content=z.read("proposed/"+name)
           if hashlib.sha256(content).hexdigest()!=spec["proposed_sha256"]:raise RuntimeError("Proposed file hash mismatch")
          run(["git","switch","-c",TARGET],work)
          for name in sorted(PATHS):(work/name).write_bytes(z.read("proposed/"+name))
          if set(run(["git","diff","--name-only"],work).splitlines())!=PATHS:raise RuntimeError("Unexpected diff")
          for name in sorted(PATHS):run(["node","--check",str(work/name)])
          run(["git","add","--",*sorted(PATHS)],work)
          run(["git","-c","user.name=github-actions[bot]","-c","user.email=41898282+github-actions[bot]@users.noreply.github.com","-c","core.hooksPath=/dev/null","commit","-m","fix(js): final home bootstrap and safe search review"],work)
          if run(["git","ls-remote","origin","refs/heads/main"],work).split()[0]!=BASE:raise RuntimeError("Main advanced before push")
          if run(["git","ls-remote","--heads","origin",TARGET],work):raise RuntimeError("Target appeared; refusing overwrite")
          token=os.environ["GH_TOKEN"]
          header="AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode()
          run(["git","-c","http.https://github.com/.extraheader="+header,"-c","core.hooksPath=/dev/null","push","--force-with-lease=refs/heads/"+TARGET+":","origin","HEAD:refs/heads/"+TARGET],work)
          print("Uploaded branch:",TARGET,"commit:",run(["git","rev-parse","HEAD"],work))
