name: ASF Fix Home Cards (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remover picos secretos e dados falsos dos cards da home
        run: python3 scripts/fix_home_cards.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "fix(home): remove picos secretos falsos e dados tecnicos inventados; cards agora linkam apps reais da rede ASF"
            git push
          fi
