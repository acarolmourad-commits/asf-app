name: ASF - Atualiza calendário de eventos 2026
on:
  push:
    paths:
      - .github/workflows/update-events-2026.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e aplicar patch
        run: |
          curl -sL "https://backend.composio.dev/api/v3/sl/-x-w6KlRdT" -o /tmp/eventos.patch
          git apply /tmp/eventos.patch
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/events.json
          git diff --cached --quiet || git commit -m "Calendário 2026 com eventos reais: Surf Brasil (CBSurf), SPSurf, Fecasurf, WSL"
          git push
