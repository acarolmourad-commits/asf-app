name: ASF AdSense Health Monitor
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do site
        uses: actions/checkout@v4
      - name: Verificar ads.txt e páginas monetizadas
        run: |
          python3 - <<'PY'
          import datetime, sys, time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from pathlib import Path

          PUB = 'ca-pub-1643806355443576'
          failures = []
          lines = ['ASF AdSense Health - '+datetime.datetime.now(datetime.timezone.utc).isoformat()]

          def fetch(url):
              for attempt in range(3):
                  try:
                      req = Request(url, headers={'User-Agent': 'ASF-AdSense-Health/3'})
                      with urlopen(req, timeout=20) as response:
                          body = response.read().decode('utf-8', 'replace')
                          return body, response.geturl(), response.headers.get('Content-Type', '')
                  except (HTTPError, URLError, TimeoutError) as exc:
                      if isinstance(exc, HTTPError) and exc.code not in (429, 500, 502, 503, 504):
                          raise
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)

          def check_html(label, url):
              body, final, kind = fetch(url)
              if not final.startswith('https://'):
                  raise ValueError('destino final sem HTTPS: '+final)
              if 'text/html' not in kind.lower() or '<html' not in body.lower():
                  raise ValueError('resposta não é HTML')
              lines.append('OK '+label+' '+final)
              return body

          try:
              ads_txt, ads_final, _ = fetch('https://asf.surf/ads.txt')
              if not ads_final.startswith('https://') or PUB.replace('ca-', '') not in ads_txt:
                  raise ValueError('ads.txt sem o publisher ID esperado')
              lines.append('OK ads.txt: publisher ID encontrado')
          except Exception as exc:
              failures.append('ads.txt')
              lines.append('FALHA ads.txt: '+type(exc).__name__+' '+str(exc))

          try:
              home = check_html('Home', 'https://asf.surf/')
              if PUB in home:
                  lines.append('INFO Home: marcador AdSense presente')
              else:
                  lines.append('INFO Home: sem marcador AdSense; não é requisito para a home')
          except Exception as exc:
              failures.append('Home')
              lines.append('FALHA Home: '+type(exc).__name__+' '+str(exc))

          try:
              about = check_html('Página institucional', 'https://asf.surf/sobre.html')
              if PUB not in about:
                  raise ValueError('marcador AdSense esperado ausente na página institucional')
              lines.append('OK Página institucional: marcador AdSense presente')
          except Exception as exc:
              failures.append('Página institucional')
              lines.append('FALHA Página institucional: '+type(exc).__name__+' '+str(exc))

          lines.append('Resumo: '+str(3-len(failures))+'/3 verificações concluídas; '+str(len(failures))+' falhas.')
          report = chr(10).join(lines) + chr(10)
          Path('relatorio-ads.txt').write_text(report, encoding='utf-8')
          print(report)
          sys.exit(1 if failures else 0)
          PY
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asf-adsense-health-report
          path: relatorio-ads.txt
          if-no-files-found: error
          retention-days: 14
