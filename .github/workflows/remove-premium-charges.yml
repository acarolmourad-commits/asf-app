name: ASF - Remove cobranças e área premium
on:
  push:
    paths:
      - .github/workflows/remove-premium-charges.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e aplicar patch
        run: |
          curl -sL "https://backend.composio.dev/api/v3/sl/XxQolvBeYC" -o /tmp/change.patch
          git apply /tmp/change.patch
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html app.js espacos-logo-app.html
          git diff --cached --quiet || git commit -m "Remove cobranças e área premium — conteúdo 100% gratuito para todas"
          git push
