name: ASF Header Menu (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with header-menu version
        run: |
          curl -fSL 'https://backend.composio.dev/api/v3/sl/-6F6pDWnjA' -o index_new.html
          test -s index_new.html
          head -c 15 index_new.html | grep -q '<!DOCTYPE html>'
          grep -q 'id="header-menu"' index_new.html
          mv index_new.html index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'home: single header menu (hamburger dropdown); remove duplicate tabs bar and bottom nav'
          git push
