name: ASF Breadcrumbs Logo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/asf-breadcrumb-logo.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch breadcrumbs with ASF logo and remove duplicates
        run: |
          echo "" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aprender praias bem-estar
          git diff --cached --quiet || git commit -m "ASF: breadcrumbs com logo nas paginas editoriais + link duplicado corrigido"
          git push
