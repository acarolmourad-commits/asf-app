name: ASF - onda 5 (calendario + boas-vindas ManaBot)
on:
  push:
    paths:
      - scripts/fix_wave5.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_wave5.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html asf-fixes.js
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: calendario carrega eventos reais e ManaBot da boas-vindas ao abrir" && git push)
