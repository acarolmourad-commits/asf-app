name: fix-orphan-div
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/split-index
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove orphan closing div (line 2845)
        run: |
          line=$(sed -n '2845p' index.html)
          if [ "$line" = "        </div>" ]; then
            sed -i '2845d' index.html
            echo "removed orphan div"
          else
            echo "UNEXPECTED CONTENT at 2845: [$line]"
            exit 1
          fi
      - name: Verify div balance
        run: |
          python3 - <<'PYEOF'
          import re
          t=open('index.html',encoding='utf-8').read()
          t2=re.sub(r'<(script|style)[^>]*>.*?</\\1>','',t,flags=re.S)
          o=len(re.findall(r'<div\\b',t2)); c=len(re.findall(r'</div>',t2))
          print('divs:',o,c)
          assert o==c, 'unbalanced'
          PYEOF
      - name: Commit and push to perf/split-index
        run: |
          git config user.name "asf-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "fix: remove </div> orfao ao fim da secao #competicoes (markup balanceado)"
          git push origin HEAD:perf/split-index
