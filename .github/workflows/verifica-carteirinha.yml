name: Verifica Carteirinha ASF (read-only)

# Este workflow NAO chama a RPC de emissao: testes agendados nao devem criar
# nem renovar registros reais. Regras de unicidade/renovacao devem ser
# testadas em ambiente Supabase de teste com fixtures descartaveis.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verifica-carteirinha.yml'
      - 'carteirinha.js'
      - 'emitir.html'
      - 'verificar.html'
      - 'carteirinhas-admin.html'
      - 'docs/carteirinhas-privacy-2026-10-07.md'
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: node --check carteirinha.js

      - name: Validar contrato e protecoes do fluxo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          js = Path('carteirinha.js').read_text(encoding='utf-8')
          emitir = Path('emitir.html').read_text(encoding='utf-8')
          verificar = Path('verificar.html').read_text(encoding='utf-8')
          admin = Path('carteirinhas-admin.html').read_text(encoding='utf-8')
          privacy = Path('docs/carteirinhas-privacy-2026-10-07.md').read_text(encoding='utf-8')

          checks = {
              'emissao usa RPC central': "emitir_carteirinha" in js and "emitir_carteirinha" in emitir,
              'nao existe escrita direta no endpoint associadas em JS da carteirinha': "/rest/v1/associadas" not in js,
              'pagina de emissao oculta resultado se RPC falhar': "Nenhuma carteirinha será exibida sem confirmação do Supabase" in emitir,
              'verificacao offline nao afirma validade': "Não considere a carteirinha válida até a consulta central responder" in verificar,
              'valores retornados pela RPC escapados antes de inserir HTML': "escapeHtml(c.nivel)" in verificar and "escapeHtml(String(c.validade)" in verificar,
              'QR da carteirinha local nao e exibido como oficial': "d.registrada ? '<a href=\"" in js and "QR após confirmação" in js,
              'painel exige sessao antes de carregar registros': "if(!logged) return" in admin,
              'documentacao proibe SELECT publico': "Não conceder SELECT público" in privacy,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + name)
          if not all(checks.values()):
              sys.exit(1)
          PY

      - name: Verificar endpoint RPC sem alterar dados
        env:
          RPC_URL: https://qktabrzbgdfndklytwub.supabase.co/rest/v1/rpc/emitir_carteirinha
          PUBLIC_KEY: sb_publishable_qIvPxh6DavCPtntfflaRLw_QI_pZJih
        run: |
          # OPTIONS e so preflight; nao chama a funcao nem grava registros.
          code=$(curl -sS -o /tmp/rpc-preflight.txt -w '%{http_code}' -X OPTIONS "$RPC_URL" \
            -H "apikey: $PUBLIC_KEY" \
            -H 'Origin: https://acarolmourad-commits.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,authorization,content-type')
          echo "RPC preflight HTTP $code"
          cat /tmp/rpc-preflight.txt
          case "$code" in
            200|204) echo 'PASS: preflight respondeu sem executar a RPC' ;;
            *) echo "::error::Preflight RPC inesperado: HTTP $code"; exit 1 ;;
          esac
