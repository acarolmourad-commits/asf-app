name: ASF Mission Fixes (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mission-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply mission fixes
        run: |
          python3 scripts/asf_mission_fixes.py
          python3 scripts/asf_fix_posts_tab.py
          python3 scripts/asf_add_hospedagens_links.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html sitemap.xml surf-trip/index.html previsao-surf/index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "feat: links para Estadias Parceiras (sitemap, surf-trip, previsao-surf)"
            git push
          fi
