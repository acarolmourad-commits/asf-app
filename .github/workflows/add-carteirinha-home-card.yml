name: Add carteirinha home card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert carteirinha card on home
        run: |
          python3 << 'PYEOF'
          h = open('index.html', encoding='utf-8').read()
          orig = h

          if 'card-carteirinha-home' in h:
            print('card ja existe'); raise SystemExit(0)

          anchor = '<small style="color:#666">Altura, per\u00edodo e dire\u00e7\u00e3o do swell em tempo real</small></span></a>'
          assert anchor in h, 'anchor nao encontrada'

          card = '''
              <a href="#carteirinha" id="card-carteirinha-home" onclick="showSection('carteirinha');ASF_CARD.init();return false" style="display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#00A8CC 0%,#9B59B6 100%);border-radius:16px;padding:18px;margin:12px 20px;text-decoration:none;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)"><span style="font-size:2rem">\U0001FAAA</span><span><b style="display:block">Carteirinha ASF</b><small style="color:rgba(255,255,255,0.85)">Sua identidade de surfista: gratuita, digital e personalizada</small></span></a>'''

          h = h.replace(anchor, anchor + card, 1)
          assert h != orig
          open('index.html', 'w', encoding='utf-8').write(h)
          print('card inserido OK')
          PYEOF
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: card da Carteirinha ASF na home (atalho para a aba \U0001FAAA Carteirinha)"
          file_pattern: index.html
