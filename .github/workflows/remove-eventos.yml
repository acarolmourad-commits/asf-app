name: ASF Remover Eventos da Home (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remover ASF Eventos da home
        run: python3 scripts/remove_eventos_home.py
      - name: Commit if changed
        run: |
          git config user.name "ASF Bot"
          git config user.email "bot@asf-app.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem mudancas"
          else
            git commit -m "refactor(home): remove secao/menu/link do ASF Eventos (app descontinuado; eventos no mural das manas)"
            git push
          fi
