name: asf-inject-mural-once
on:
  push:
    paths:
      - ".github/workflows/asf-inject-mural-once.yml"
      - "scripts/inject_mural.py"
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Injetar includes aditivos (index.html e guia-apps.html)
        run: python3 scripts/inject_mural.py
      - name: Commit se houve mudanca
        run: |
          git config user.name "asf-bot"
          git config user.email "asf-bot@users.noreply.github.com"
          git add index.html guia-apps.html
          git diff --cached --quiet || git commit -m "chore: includes Mural/BottomNav/SW na home e guia-apps (aditivo, zero 404)"
          git push
