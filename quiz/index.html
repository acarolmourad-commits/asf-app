<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASF Quiz 🧠 Trilha de Conhecimento — 5 níveis sequenciais | ASF</title>
<meta name="description" content="Trilha de quiz do surf em 5 níveis sequenciais: complete um nível para desbloquear o próximo, ganhe +50 pontos por nível e desbloqueie as conquistas Primeira Onda, Estudiosa e Surfista Completa.">
<link rel="canonical" href="https://acarolmourad-commits.github.io/asf-app/quiz/">
<meta property="og:title" content="ASF Quiz — Trilha de Conhecimento do Surf">
<meta property="og:description" content="5 níveis sequenciais. Complete para desbloquear o próximo e ganhar pontos ASF.">
<meta property="og:url" content="https://acarolmourad-commits.github.io/asf-app/quiz/">
<style>
:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--rosa:#ff4d8d;--bg:#F7FBFC;--ok:#27AE60}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--d);line-height:1.55}
nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px 16px;display:flex;gap:14px;flex-wrap:wrap;z-index:10;justify-content:center}
nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}
header{background:linear-gradient(135deg,var(--rosa),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}
header h1{font-size:clamp(24px,5vw,32px)}
header p{opacity:.95;margin-top:8px}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.level{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(14,36,57,.06);border-left:5px solid var(--p)}
.level.locked{opacity:.6;border-left-color:#ccc}
.level h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.level p{font-size:13px;color:#5A6B7A;margin:6px 0 12px}
.badge-done{background:var(--ok);color:#fff;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-lock{background:#eee;color:#888;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
button.play{width:100%;background:linear-gradient(90deg,var(--p),var(--d));color:#fff;border:none;padding:12px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
button.play:disabled{background:#ccc;cursor:not-allowed}
.qopt{display:block;width:100%;margin:8px 0;background:#fff;border:2px solid var(--p);color:var(--d);border-radius:12px;padding:12px;font-size:15px;cursor:pointer;text-align:left}
.qopt:hover{background:#eaf7fb}
.qopt.certa{background:#e8f8ef;border-color:var(--ok)}
.qopt.errada{background:#fdecea;border-color:#e74c3c}
#game{display:none}
.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--p),var(--u));transition:width .4s}
footer{text-align:center;font-size:12.5px;color:#5A6B7A;padding:24px;border-top:1px solid #E5EEF2}
footer a{color:var(--p);font-weight:700}
</style>
</head>
<body>
<nav>
<a href="https://acarolmourad-commits.github.io/asf-app/">🏄 ASF App</a>
<a href="https://acarolmourad-commits.github.io/asf-app/guia-apps.html">🗺️ Guia de Apps</a>
<a href="https://acarolmourad-commits.github.io/asf-quiz/">🧠 Quiz Diário</a>
<a href="https://acarolmourad-commits.github.io/asf-ranking/">🏆 Ranking</a>
</nav>
<header>
<h1>🧠 ASF Quiz — Trilha de Conhecimento</h1>
<p>5 níveis em sequência: complete um para desbloquear o próximo.<br>+50 pontos por nível • desbloqueia as conquistas da home 🏆</p>
</header>
<main class="wrap">

<div id="levels"></div>

<div id="game" class="level" style="border-left-color:var(--u)">
  <h3 id="g-title"></h3>
  <div class="bar"><div id="g-bar" style="width:0%"></div></div>
  <p id="g-q" style="font-size:16px;color:var(--d);margin:10px 0"></p>
  <div id="g-opts"></div>
  <p id="g-fb" style="font-weight:700;margin-top:10px;min-height:22px"></p>
</div>

<div id="end" class="level" style="display:none;border-left-color:var(--ok);text-align:center">
  <h3 style="justify-content:center">🏆 <span id="end-title"></span></h3>
  <p id="end-text" style="text-align:center"></p>
  <button class="play" onclick="location.href='https://acarolmourad-commits.github.io/asf-app/'">🏄 Voltar para a home e ver minhas conquistas</button>
</div>

</main>
<footer>ASF — Associação de Surf Feminino · <a href="../privacidade.html">Privacidade</a> · <a href="https://acarolmourad-commits.github.io/asf-app/">App principal</a></footer>

<script>
var LEVELS=[
 {name:'Nível 1 · Fundamentos',desc:'O básico para entrar no mar com confiança.',qs:[
  {q:'O que é o "lineup"?',o:['Área onde surfistas esperam ondas','Tipo de prancha','Manobra aérea'],a:0},
  {q:'O que significa "swell"?',o:['Vento forte','Série de ondas vinda do oceano','Corrente de retorno'],a:1},
  {q:'Quem tem prioridade na onda?',o:['Quem grita mais alto','Quem está mais perto do pico','Quem tem a prancha maior'],a:1},
  {q:'O que é "duck dive"?',o:['Mergulho por baixo da onda com a prancha','Queda feia','Tipo de remada'],a:0}]},
 {name:'Nível 2 · Maré e Vento',desc:'Aprenda a ler as condições antes de entrar.',qs:[
  {q:'Vento "offshore" sopra...',o:['Do mar para a praia','Da praia para o mar (deixa as ondas limpas)','Em círculos'],a:1},
  {q:'Na maré enchente, geralmente...',o:['O mar sobe','O mar seca','Não muda nada'],a:0},
  {q:'Período de swell acima de 12s indica...',o:['Ondas fracas','Ondas fortes e organizadas','Mar flat'],a:1},
  {q:'Antes de surfar, o ideal é...',o:['Só olhar o celular','Observar o mar por 10 min e checar a previsão','Entrar correndo'],a:1}]},
 {name:'Nível 3 · Segurança',desc:'O que te mantém segura no line-up.',qs:[
  {q:'Corrente de retorno: o que fazer?',o:['Nadar contra ela','Entrar em pânico','Nadar paralela à praia até sair'],a:2},
  {q:'Se cair da prancha, proteja...',o:['A prancha','A cabeça com os braços','O celular'],a:1},
  {q:'O leash serve para...',o:['Prender a prancha no tornozelo','Enfeitar','Amarrar na prancha de outra pessoa'],a:0},
  {q:'Sinal de socorro no mar:',o:['Um braço erguido e acenando','Gritar baixinho','Mergulhar'],a:0}]},
 {name:'Nível 4 · Equipamento',desc:'Prancha, parafina e roupa certa.',qs:[
  {q:'Iniciantes devem começar com...',o:['Prancha pequena e fina','Prancha grande e macia (softboard)','Stand-up paddle'],a:1},
  {q:'Água fria pede parafina...',o:['Basecoat quente','Cold water (água fria)','Tanto faz'],a:1},
  {q:'Long wetsuit é usada quando...',o:['Água quente','Água fria','Só para foto'],a:1},
  {q:'Quilhas servem para...',o:['Estabilidade e direção','Peso extra','Decorar'],a:0}]},
 {name:'Nível 5 · Etiqueta do Mar',desc:'O respeito que mantém o line-up em paz.',qs:[
  {q:'"Dropar" a onda de alguém é...',o:['Legal','Falta de etiqueta e perigoso','Encorajado'],a:1},
  {q:'Ao remar de volta, evite...',o:['Ficar no caminho de quem está na onda','Olhar para o mar','Cumprimentar'],a:0},
  {q:'No line-up, a vibe certa é...',o:['Competir e gritar','Respeitar, esperar sua vez e incentivar','Ignorar todo mundo'],a:1},
  {q:'Lixo na praia:',o:['Deixar para a prefeitura','Levar o seu (e o que puder) embora','Enterrar na areia'],a:1}]}
];
var KEY='asf-quiz-level';
function unlocked(){return parseInt(localStorage.getItem(KEY)||'1');}
function doneLevels(){return unlocked()-1;}
function addPoints(){
  try{
    var p=JSON.parse(localStorage.getItem('asf_points')||'{"total":0,"quizzes":0,"dicas":0,"treinos":0}');
    p.total+=50; p.quizzes++;
    localStorage.setItem('asf_points',JSON.stringify(p));
    var qd=JSON.parse(localStorage.getItem('quizzes-done')||'[]');
    qd.push({date:new Date().toISOString(),app:'asf-app/quiz'});
    localStorage.setItem('quizzes-done',JSON.stringify(qd));
    return qd.length;
  }catch(e){return 0;}
}
function renderLevels(){
  var u=unlocked(), html='';
  for(var l=0;l<LEVELS.length;l++){
    var lv=LEVELS[l], isOpen=(l+1)<=u, isDone=(l+1)<u;
    html+='<div class="level'+(isOpen?'':' locked')+'">'
      +'<h3>'+lv.name+' '+(isDone?'<span class="badge-done">✅ CONCLUÍDO</span>':(isOpen?'<span style="color:var(--p);font-size:12px">ABERTO</span>':'<span class="badge-lock">🔒 BLOQUEADO</span>'))+'</h3>'
      +'<p>'+lv.desc+' '+lv.qs.length+' perguntas em sequência.</p>'
      +'<button class="play" '+(isOpen?('onclick="start('+l+')"'):'disabled')+'>'+(isDone?'🔁 Refazer nível':(isOpen?'▶ Começar':'🔒 Complete o nível anterior'))+'</button>'
      +'</div>';
  }
  document.getElementById('levels').innerHTML=html;
}
var cur=0, qi=0;
function start(l){
  cur=l; qi=0;
  document.getElementById('levels').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('end').style.display='none';
  document.getElementById('g-title').textContent=LEVELS[l].name;
  showQ();
}
function showQ(){
  var L=LEVELS[cur], x=L.qs[qi];
  document.getElementById('g-bar').style.width=((qi)/L.qs.length*100)+'%';
  document.getElementById('g-q').textContent=(qi+1)+'/'+L.qs.length+' — '+x.q;
  document.getElementById('g-fb').textContent='';
  document.getElementById('g-opts').innerHTML=x.o.map(function(o,j){
    return '<button class="qopt" onclick="ans(this,'+j+')">'+o+'</button>';
  }).join('');
}
function ans(btn,j){
  var x=LEVELS[cur].qs[qi];
  if(j===x.a){ btn.classList.add('certa'); document.getElementById('g-fb').textContent='✅ Certo!'; }
  else { btn.classList.add('errada'); document.getElementById('g-fb').textContent='❌ Resposta certa: '+x.o[x.a]; }
  var opts=document.getElementById('g-opts').querySelectorAll('button');
  opts.forEach(function(b){b.disabled=true;});
  qi++;
  setTimeout(function(){
    if(qi>=LEVELS[cur].qs.length){ finish(); } else { showQ(); }
  },1400);
}
function finish(){
  var total=addPoints();
  var nu=Math.min(unlocked()+1, LEVELS.length+1);
  localStorage.setItem(KEY, nu);
  document.getElementById('game').style.display='none';
  var e=document.getElementById('end'); e.style.display='block';
  var last = (nu>LEVELS.length);
  document.getElementById('end-title').textContent = last ? 'Trilha completa! 🌊' : 'Nível desbloqueado!';
  document.getElementById('end-text').innerHTML = '+50 pontos ASF! Você já completou <b>'+doneLevels()+' de 5 níveis</b> e <b>'+total+' quizzes</b> no total.<br>'
    + (total>=10 ? '🏄 Conquista <b>Surfista Completa</b> desbloqueada na home!<br>'
      : total>=5 ? '📚 Conquista <b>Estudiosa</b> desbloqueada na home!<br>'
      : total>=1 ? '🌟 Conquista <b>Primeira Onda</b> desbloqueada na home!<br>' : '')
    + (last ? 'Você zerou a trilha! Continue no <a href="https://acarolmourad-commits.github.io/asf-quiz/" style="color:var(--p);font-weight:700">Quiz Diário</a>.' : 'O próximo nível já está aberto 👇');
  renderLevels();
  document.getElementById('levels').style.display='block';
}
renderLevels();
</script>
<script src="https://acarolmourad-commits.github.io/asf-app/asf-network.js" defer></script>
</body>
</html>
